<html>
  <head>
    <style>
    /* CSS 3 parts: 
    1 selector
    2 property
    3 value
    */
      img {
        width: 200px;
      }
      
      p {
        color: red;
      }
    </style>
  </head>
  
  <body>
    <h1>Heading 1</h1>
    <h2>heading 2</h2>
    <h3>heading 3</h3>
    <h4>heading 4</h4>
    <h5>heading 5</h5>
    <h6>heading 6</h6>
    
    <p>this is a paragraph</p>
    <section>Profile</section>
    
    <!-- ctrl+/ -->
    <!-- unordered list -->
    <ul>
      <!-- list item -->
      <li>playing with friends</li>
      <li>hiking</li>
      <li>tennis</li>
    </ul>
    
    <!-- ordered list -->
    <ol>
      <li>step 1</li>
      <li>step 2</li>
    </ol>
    
    <img src="https://images.pexels.com/photos/3739327/pexels-photo-3739327.jpeg">
    
    <!--anchor tag-->
    <a href="https://www.google.com">Google</a>
  </body>
</html>
